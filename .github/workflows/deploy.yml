name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch ./dist/.nojekyll

      # Dual-Deployment Method 1: Publish to gh-pages branch (works when Pages source is set to "Deploy from a branch")
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # Dual-Deployment Method 2: Upload Pages artifact for GitHub Actions deployment mode
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (GitHub Actions mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify Deployment Status
        run: |
          echo "=========================================================="
          echo "GitHub Pages deployment process completed."
          echo "Repository: https://github.com/${{ github.repository }}"
          echo "If Pages is set to 'GitHub Actions': deployment is live via deploy-pages."
          echo "If Pages is set to 'Deploy from a branch': deployment is live on the 'gh-pages' branch."
          echo "To verify or change settings, visit: https://github.com/${{ github.repository }}/settings/pages"
          echo "=========================================================="
